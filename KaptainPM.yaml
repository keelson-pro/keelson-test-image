apiVersion: kaptain.org/1.28
kind: docker-build-dockerfile
metadata:
  description: "Keelson test image - minimal Debian Trixie slim with BATS, shellcheck, and yq for running keelson script tests; all network tooling (kubectl/skopeo/curl/ECR helper) is mocked at the bats layer"

spec:
  layers:
    - ghcr.io/kube-kaptain/layer/layer-github-flow-strict:[1.3]
  main:
    docker:
      platform: linux/amd64,linux/arm64
      dockerfile:
        subPathLinuxAmd64: src/docker
        subPathLinuxArm64: src/docker
  global:
    release:
      versioning:
        maxParts: 2
